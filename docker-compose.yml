
services:
  frontend:
    image: nginx:alpine
    container_name: compose-frontend
    ports:
      - "8085:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./frontend/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - app-network

  backend:
    image: python:3.12-alpine
    container_name: compose-backend
    working_dir: /app
    command: python app.py
    volumes:
      - ./backend:/app:ro
      - backend-data:/data
    environment:
      APP_MESSAGE: "Hello from Python backend through Docker Compose!"
    networks:
      - app-network

volumes:
  backend-data:

networks:
  app-network:
    driver: bridge
